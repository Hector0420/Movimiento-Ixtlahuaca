<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Simpatizante - Unidos por Ixtlahuaca</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);</script>
    <!-- GA -->
</head>
<body class="bg-white">
    <nav id="navbar" class="bg-white shadow-sm border-b border-gray-200"></nav>
    <main class="max-w-md mx-auto px-4 py-12">
        <h1 class="text-3xl font-bold text-blue-900 mb-6">Únete al Movimiento</h1>
        <p class="text-gray-600 mb-6">Deja tus datos y sé parte del diagnóstico ciudadano. Construyamos juntos el futuro de Ixtlahuaca.</p>
        <form id="register-form" class="space-y-4">
            <input type="text" id="first_name" placeholder="Nombre(s)" required class="w-full border rounded px-4 py-2">
            <input type="text" id="last_name" placeholder="Apellidos" required class="w-full border rounded px-4 py-2">
            <input type="email" id="email" placeholder="Correo electrónico" required class="w-full border rounded px-4 py-2">
            <input type="tel" id="phone" placeholder="Teléfono (10 dígitos)" class="w-full border rounded px-4 py-2">
            <select id="zone" class="w-full border rounded px-4 py-2">
                <option value="">Selecciona tu zona</option>
                <option value="Centro">Zona 1 - Centro</option>
                <option value="Norte">Zona 2 - Norte</option>
                <option value="Sur">Zona 3 - Sur</option>
                <option value="Oriente">Zona 4 - Oriente</option>
                <option value="Poniente">Zona 5 - Poniente</option>
            </select>
            <input type="text" id="whatsapp" placeholder="WhatsApp (opcional)" class="w-full border rounded px-4 py-2">
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Registrarme</button>
        </form>
        <p id="message" class="mt-4 text-center text-sm hidden"></p>
    </main>
    <footer id="footer" class="bg-gray-50 border-t border-gray-200 text-center py-6 text-sm text-gray-600"></footer>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const first_name = document.getElementById('first_name').value.trim();
            const last_name = document.getElementById('last_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const zone = document.getElementById('zone').value;
            const whatsapp = document.getElementById('whatsapp').value.trim();

            if (!first_name || !last_name || !email) {
                alert('Completa los campos obligatorios');
                return;
            }

            const { error } = await supabase
                .from('sympathizers')
                .insert([{ first_name, last_name, email, phone, zone, whatsapp }]);

            const msg = document.getElementById('message');
            msg.classList.remove('hidden');
            if (error) {
                msg.textContent = 'Error: ' + error.message;
                msg.classList.add('text-red-500');
            } else {
                msg.textContent = '¡Registro exitoso! Bienvenido al movimiento.';
                msg.classList.add('text-green-600');
                document.getElementById('register-form').reset();
                // Log
                await logActivity('register_sympathizer', { first_name, last_name });
            }

        });

        window.addEventListener('DOMContentLoaded', loadNavFooter);
    </script>
</body>
</html>
