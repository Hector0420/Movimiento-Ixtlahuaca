<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidos por Ixtlahuaca</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=" + GA_MEASUREMENT_ID></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        if (GA_MEASUREMENT_ID) gtag('config', GA_MEASUREMENT_ID);
    </script>
</head>
<body class="bg-white text-gray-900">
    <!-- Navbar dinámico -->
    <nav id="navbar" class="bg-white shadow-sm border-b border-gray-200"></nav>

    <main class="max-w-5xl mx-auto px-4 py-12">
        <!-- Hero -->
        <section class="text-center mb-16">
            <h1 class="text-5xl font-extrabold text-blue-900 mb-4">Unidos por Ixtlahuaca</h1>
            <p class="text-2xl text-blue-700 mb-4">Contemos una nueva historia</p>
            <p class="text-lg text-gray-600 max-w-2xl mx-auto">
                Gira de Diagnóstico Ciudadano y Rescate de la Identidad Histórica. Regresa el líder que originó el movimiento para organizar la casa.
            </p>
        </section>

        <!-- Últimas acciones -->
        <section>
            <h2 class="text-3xl font-bold text-blue-800 mb-8">Últimas acciones</h2>
            <div id="actions-container" class="grid gap-6 md:grid-cols-3"></div>
        </section>
    </main>

    <footer id="footer" class="bg-gray-50 border-t border-gray-200 text-center py-6 text-sm text-gray-600"></footer>

    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        async function init() {
            await loadNavFooter();
            await loadActions();
            if (typeof gtag !== 'undefined' && GA_MEASUREMENT_ID) {
                gtag('config', GA_MEASUREMENT_ID, { page_path: window.location.pathname });
            }
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
